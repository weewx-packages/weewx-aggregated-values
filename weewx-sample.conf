[AggregatedValues]
    # Extension must be enabled to run
    enable = true

    # cache_dir is set during installation, but must be valid and writeable by weewxd
    cache_dir = /etc/weewx/AggregatedValues

    # Since hour is used by the extension as the reset time for rain measurements, eg 0 for midnight or an hour, in this case 9am
    since_hour = 9

    # The following settings turn time periods on or off for fields with period = day or since.
    # Each defaults to true if it isn't set. Fields with any other period (eg last3hours) aren't
    # affected by these settings.
    # "day", "month", "year" and "alltime" are recalculated on every archive record. "yesterday",
    # "last_month" and "last_year" are cached and only recalculated when the day changes (at
    # midnight, or at since_hour) or when WeeWX restarts with a changed [AggregatedValues] config.

    # Generate daily statistics
    day = true

    # Generate statistics for yesterday
    yesterday = true

    # Generate statistics for the current month
    month = true

    # Generate statistics for last month
    last_month = true

    # Generate statistics for the current year
    year = true

    # Generate statistics for last year
    last_year = true

    # Generate all time statistics
    alltime = true

    # Each sub-section below is a field. The section name can be anything, eg outTemp_max, and
    # is used to name the values added to the archive record.
    #
    #   observation     - The WeeWX observation to aggregate, eg outTemp, barometer, rain, wind.
    #
    #   aggregation     - The type of aggregation, eg min, max, mintime, maxtime, avg, sum, diff,
    #                     vecdir, gustdir. See https://www.weewx.com/docs/customizing.htm#aggregation_types
    #
    #   period          - The time period to aggregate over. Valid values:
    #                       day      Output once for each time period enabled above, using the
    #                                time period as a prefix, eg day_outTemp_max, yesterday_outTemp_max,
    #                                month_outTemp_max, ... alltime_outTemp_max
    #                       since    The same as day, but each day starts at since_hour instead of
    #                                midnight, eg for rain totals reported 9am to 9am. Days are
    #                                dated by the day they end on, the same as BoM, so a month or
    #                                year is the days dated within it, eg October is 9am on 30
    #                                September to 9am on 31 October
    #                       hour, week, last3hours, last24hours, last7days, last31days, last366days,
    #                       yesterday, month, last_month, year, last_year, alltime
    #                                Output once using the section name, eg barometer_diff, and
    #                                recalculated on every archive record
    #                     A field with an invalid period is skipped, with an error in the log.
    #
    #   conversion_type - Optional. Set to integer or float to convert the value. Missing values
    #                     become 0 instead of being left empty.
    #
    #   ignore          - Optional. Set to true to turn the field off without removing it.
    #
    # To remove a field, comment out or delete the whole sub-section (or set ignore = true) and
    # restart WeeWX. Its values are no longer added to the archive record and any cached values
    # are discarded.

    # Change over the last 3 hours, eg for pressure trends.
    # Output as appTemp_diff, barometer_diff, ...
    [[appTemp_diff]]
        observation = appTemp
        aggregation = diff
        period = last3hours
    
    [[barometer_diff]]
        observation = barometer
        aggregation = diff
        period = last3hours
    
    [[dewpoint_diff]]
        observation = dewpoint
        aggregation = diff
        period = last3hours
    
    [[inHumidity_diff]]
        observation = inHumidity
        aggregation = diff
        period = last3hours
    
    [[inTemp_diff]]
        observation = inTemp
        aggregation = diff
        period = last3hours
    
    [[outHumidity_diff]]
        observation = outHumidity
        aggregation = diff
        period = last3hours
    
    [[outTemp_diff]]
        observation = outTemp
        aggregation = diff
        period = last3hours
    
    [[THSW_diff]]
        observation = THSW
        aggregation = diff
        period = last3hours
    
    # Daily highs and lows, and the times they occurred.
    # Output as day_appTemp_min, yesterday_appTemp_min, month_appTemp_min, ...
    [[appTemp_min]]
        observation = appTemp
        aggregation = min
        period = day

    [[appTemp_mintime]]
        observation = appTemp
        aggregation = mintime
        period = day

    [[appTemp_max]]
        observation = appTemp
        aggregation = max
        period = day

    [[appTemp_maxtime]]
        observation = appTemp
        aggregation = maxtime
        period = day

    [[barometer_min]]
        observation = barometer
        aggregation = min
        period = day
    
    [[barometer_mintime]]
        observation = barometer
        aggregation = mintime
        period = day
    
    [[barometer_max]]
        observation = barometer
        aggregation = max
        period = day
    
    [[barometer_maxtime]]
        observation = barometer
        aggregation = maxtime
        period = day
    
    [[dewpoint_min]]
        observation = dewpoint
        aggregation = min
        period = day
    
    [[dewpoint_mintime]]
        observation = dewpoint
        aggregation = mintime
        period = day
    
    [[dewpoint_max]]
        observation = dewpoint
        aggregation = max
        period = day
    
    [[dewpoint_maxtime]]
        observation = dewpoint
        aggregation = maxtime
        period = day
    
    [[ET_sum]]
        observation = ET
        aggregation = sum
        period = day
    
    [[inHumidity_min]]
        observation = inHumidity
        aggregation = min
        period = day
    
    [[inHumidity_mintime]]
        observation = inHumidity
        aggregation = mintime
        period = day
    
    [[inHumidity_max]]
        observation = inHumidity
        aggregation = max
        period = day
    
    [[inHumidity_maxtime]]
        observation = inHumidity
        aggregation = maxtime
        period = day
    
    [[inTemp_min]]
        observation = inTemp
        aggregation = min
        period = day
    
    [[inTemp_mintime]]
        observation = inTemp
        aggregation = mintime
        period = day
    
    [[inTemp_max]]
        observation = inTemp
        aggregation = max
        period = day
    
    [[inTemp_maxtime]]
        observation = inTemp
        aggregation = maxtime
        period = day
    
    [[outHumidity_min]]
        observation = outHumidity
        aggregation = min
        period = day
    
    [[outHumidity_mintime]]
        observation = outHumidity
        aggregation = mintime
        period = day
    
    [[outHumidity_max]]
        observation = outHumidity
        aggregation = max
        period = day
    
    [[outHumidity_maxtime]]
        observation = outHumidity
        aggregation = maxtime
        period = day
    
    [[outTemp_min]]
        observation = outTemp
        aggregation = min
        period = day
    
    [[outTemp_mintime]]
        observation = outTemp
        aggregation = mintime
        period = day
    
    [[outTemp_max]]
        observation = outTemp
        aggregation = max
        period = day
    
    [[outTemp_maxtime]]
        observation = outTemp
        aggregation = maxtime
        period = day
    
    [[radiation_max]]
        observation = radiation
        aggregation = max
        period = day
    
    [[radiation_maxtime]]
        observation = radiation
        aggregation = maxtime
        period = day
    
    # Rain totals, with each day starting at since_hour, eg 9am to 9am.
    # Output as day_rain_sum, yesterday_rain_sum, month_rain_sum, ...
    [[rain_sum]]
        observation = rain
        aggregation = sum
        period = since
    
    [[THSW_min]]
        observation = THSW
        aggregation = min
        period = day

    [[THSW_mintime]]
        observation = THSW
        aggregation = mintime
        period = day

    [[THSW_max]]
        observation = THSW
        aggregation = max
        period = day

    [[THSW_maxtime]]
        observation = THSW
        aggregation = maxtime
        period = day

    [[UV_max]]
        observation = UV
        aggregation = max
        period = day
    
    [[UV_maxtime]]
        observation = UV
        aggregation = maxtime
        period = day
    
    # Wind. For observation = wind, max and maxtime use windGust, other aggregations use windSpeed.
    # vecdir and gustdir fields with period = day also output the compass direction as text,
    # eg day_wind_vecdir_str = NNE (or N/A if there's no value).
    [[wind_avg]]
        observation = windSpeed
        aggregation = avg
        period = day
    
    [[wind_vecdir]]
        observation = wind
        aggregation = vecdir
        period = day
        conversion_type = integer
    
    [[wind_max]]
        observation = wind
        aggregation = max
        period = day
    
    [[wind_maxtime]]
        observation = wind
        aggregation = maxtime
        period = day
    
    [[wind_gustdir]]
        observation = wind
        aggregation = gustdir
        period = day
        conversion_type = integer
